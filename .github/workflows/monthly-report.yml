name: AFH Product Signal

on:
  schedule:
    # 09:00 UTC on the 2nd of each month. The 2nd, not the 1st, so the previous
    # month is genuinely closed out and late-arriving tickets are counted.
    - cron: "0 9 2 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Month to report on (YYYY-MM). Blank = last complete month."
        required: false
        type: string
      skip_slack:
        description: "Generate the dashboard but do not post to Slack"
        required: false
        type: boolean
        default: false

# Two runs overlapping would race the gh-pages push. Queue, never cancel.
concurrency:
  group: afh-report
  cancel-in-progress: false

permissions:
  contents: write   # push to gh-pages
  actions: write    # keepalive: re-enable this workflow's schedule

env:
  FIRST_DAY: "2025-12-01"   # date of the first AFH ticket; history starts here
  WORKDIR: /tmp/afh         # PHI lives here for the life of the job only

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Ticket key -> theme labels are patient-level, so they live in optional
      # secrets, not the repo. Without them the run still publishes; the pages
      # say accuracy was not measured instead of showing 0 of 0.
      - name: Restore hand labels (job-local only, optional)
        env:
          AFH_GOLD_SET: ${{ secrets.AFH_GOLD_SET }}
          AFH_TEST_SET: ${{ secrets.AFH_TEST_SET }}
        run: |
          if [ -z "${AFH_GOLD_SET}" ] || [ -z "${AFH_TEST_SET}" ]; then
            echo "::notice::AFH_GOLD_SET / AFH_TEST_SET not set; grouping accuracy will not be measured"
            exit 0
          fi
          mkdir -p tests/data
          printf '%s\n' "${AFH_GOLD_SET}" > tests/data/gold_set.tsv
          printf '%s\n' "${AFH_TEST_SET}" > tests/data/test_set.tsv

      # A broken classifier should fail here, not silently publish wrong
      # numbers to a dashboard people make decisions from.
      - name: Test
        run: python -m pytest tests/ -q

      - name: Resolve window
        id: window
        run: |
          python3 scripts/resolve_window.py \
            --month "${{ inputs.month }}" \
            --first-day "${FIRST_DAY}"

      - name: Fetch tickets (PHI, job-local only)
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          python3 scripts/fetch_data.py \
            --start-date "${{ steps.window.outputs.start }}" \
            --end-date   "${{ steps.window.outputs.end }}" \
            --output-dir "${WORKDIR}"

      - name: Classify
        run: |
          python3 scripts/classify.py \
            --tickets "${WORKDIR}/tickets.json" \
            --output  "${WORKDIR}/classified.json"

      - name: Grouping precision (held-out set)
        env:
          AFH_WORKDIR: ${{ env.WORKDIR }}
        run: python -m pytest tests/test_precision.py -q

      # No --audit-output: the theme -> ticket-key map is patient-level and has
      # no business on a runner. Audit a number with run_month.sh locally.
      - name: Compute report (aggregates only — this is the PHI boundary)
        run: |
          python3 scripts/compute_report.py \
            --classified "${WORKDIR}/classified.json" \
            --output     "${WORKDIR}/report.json" \
            --start-date "${{ steps.window.outputs.start }}" \
            --end-date   "${{ steps.window.outputs.end }}"

      - name: Assert no PHI in the aggregate
        run: python3 scripts/assert_no_phi.py --report "${WORKDIR}/report.json"

      - name: Generate pages
        run: |
          python3 scripts/generate_pages.py \
            --report     "${WORKDIR}/report.json" \
            --output-dir "${WORKDIR}/pages"

      # The structural check above passes on report.json's shape. This one reads
      # every byte that will actually be served -- HTML and CSV included, since
      # a template or an export can leak something the aggregate never held.
      - name: Assert no PHI in anything about to be published
        run: |
          python3 scripts/assert_no_phi.py \
            --report    "${WORKDIR}/report.json" \
            --pages-dir "${WORKDIR}/pages"

      # publish.py owns the gh-pages layout: newest month at the root, a frozen
      # archive/<month>/ permalink, the archive index, and a final PHI scan over
      # the whole assembled tree before it pushes.
      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/publish.py \
            --pages  "${WORKDIR}/pages" \
            --report "${WORKDIR}/report.json" \
            --month  "${{ steps.window.outputs.month }}" \
            --label  "${{ steps.window.outputs.label }}" \
            --remote "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
            --push

      - name: Slack digest
        if: ${{ inputs.skip_slack != true }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          ORG=$(echo "${{ github.repository }}" | cut -d/ -f1 | tr '[:upper:]' '[:lower:]')
          REPO=$(echo "${{ github.repository }}" | cut -d/ -f2)
          python3 scripts/notify_slack.py \
            --report "${WORKDIR}/report.json" \
            --config config/slack.json \
            --base-url "https://${ORG}.github.io/${REPO}/archive/${{ steps.window.outputs.month }}/" \
            --label "${{ steps.window.outputs.label }}"

      # GitHub disables cron workflows on public repos after 60 days without a
      # commit to the default branch, and gh-pages pushes do not count.
      # Re-enabling on every run keeps the schedule alive indefinitely.
      - name: Keep the schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow enable monthly-report.yml -R "${{ github.repository }}"

      - name: Shred the PHI workdir
        if: always()
        run: rm -rf "${WORKDIR}" tests/data
