name: AFH Product Signal

on:
  schedule:
    # 09:00 UTC on the 2nd of each month. The 2nd, not the 1st, so the previous
    # month is genuinely closed out and late-arriving tickets are counted.
    - cron: "0 9 2 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Month to report on (YYYY-MM). Blank = last complete month."
        required: false
        type: string
      skip_slack:
        description: "Generate the dashboard but do not post to Slack"
        required: false
        type: boolean
        default: false

# Two scheduled runs overlapping would race the gh-pages push. Let the newer win.
concurrency:
  group: afh-report
  cancel-in-progress: false

permissions:
  contents: write   # push to gh-pages

env:
  FIRST_DAY: "2025-12-01"   # date of the first AFH ticket; history starts here
  WORKDIR: /tmp/afh         # PHI lives here for the life of the job only

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Cheap insurance: a broken classifier should fail here, not silently
      # publish wrong numbers to a dashboard people make decisions from.
      - name: Test
        run: python -m pytest tests/ -q

      - name: Resolve window
        id: window
        run: |
          python3 scripts/resolve_window.py \
            --month "${{ inputs.month }}" \
            --first-day "${FIRST_DAY}"

      - name: Fetch tickets (PHI, job-local only)
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          python3 scripts/fetch_data.py \
            --start-date "${{ steps.window.outputs.start }}" \
            --end-date   "${{ steps.window.outputs.end }}" \
            --output-dir "${WORKDIR}"

      - name: Classify
        run: |
          python3 scripts/classify.py \
            --tickets "${WORKDIR}/tickets.json" \
            --output  "${WORKDIR}/classified.json"

      - name: Compute report (aggregates only — this is the PHI boundary)
        run: |
          python3 scripts/compute_report.py \
            --classified "${WORKDIR}/classified.json" \
            --output     "${WORKDIR}/report.json" \
            --start-date "${{ steps.window.outputs.start }}" \
            --end-date   "${{ steps.window.outputs.end }}"

      - name: Assert no PHI in the aggregate
        run: python3 scripts/assert_no_phi.py --report "${WORKDIR}/report.json"

      - name: Generate pages
        run: |
          python3 scripts/generate_pages.py \
            --report     "${WORKDIR}/report.json" \
            --output-dir "${WORKDIR}/pages"

      # The structural check above passes on report.json's shape. This one reads
      # every byte that will actually be served -- HTML and CSV included, since
      # a template or an export can leak something the aggregate never held.
      - name: Assert no PHI in anything about to be published
        run: |
          python3 scripts/assert_no_phi.py \
            --report    "${WORKDIR}/report.json" \
            --pages-dir "${WORKDIR}/pages"

      # The root page always shows the newest month; each month also keeps a
      # permalink, so a Slack link posted in June still reads as June next year.
      - name: Stage the month permalink
        run: |
          DEST="${WORKDIR}/pages/archive/${{ steps.window.outputs.month }}"
          mkdir -p "${DEST}"
          # Everything except the archive dir itself, so months do not nest.
          rsync -a --exclude 'archive' "${WORKDIR}/pages/" "${DEST}/"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ env.WORKDIR }}/pages
          keep_files: true   # never wipe older months out of archive/
          commit_message: "AFH product signal — ${{ steps.window.outputs.label }}"

      - name: Slack digest
        if: ${{ inputs.skip_slack != true }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          ORG=$(echo "${{ github.repository }}" | cut -d/ -f1)
          REPO=$(echo "${{ github.repository }}" | cut -d/ -f2)
          python3 scripts/notify_slack.py \
            --report "${WORKDIR}/report.json" \
            --config config/slack.json \
            --base-url "https://${ORG}.github.io/${REPO}/archive/${{ steps.window.outputs.month }}/" \
            --label "${{ steps.window.outputs.label }}"

      - name: Shred the PHI workdir
        if: always()
        run: rm -rf "${WORKDIR}"
