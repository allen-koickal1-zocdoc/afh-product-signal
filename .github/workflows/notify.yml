name: AFH Notify

# `published` is dispatched by the afh-signal skill's `run.py publish` after a
# successful push:  gh workflow run notify.yml -R <repo> -f month=YYYY-MM
# There is no `on: push: branches: [gh-pages]` trigger: a push event reads the
# workflow from the pushed commit, and gh-pages carries no .github/, so it
# would never fire.
on:
  workflow_dispatch:
    inputs:
      month:
        description: "YYYY-MM that was just published (optional; must match latest.json when given)"
        required: false
        default: ""
  schedule:
    - cron: "0 14 2 * *"

permissions:
  contents: read

env:
  SLACK_CHANNEL: C0C7UPMH58W   # #test-ak

jobs:
  published:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v5
        with:
          ref: gh-pages

      - name: Post to Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          MONTH: ${{ inputs.month }}
        run: |
          if [ ! -f latest.json ]; then
            echo "::error::latest.json not found on gh-pages"
            exit 1
          fi
          for f in month month_label headline url; do
            if ! jq -e --arg f "$f" '(.[$f] // "") | type == "string" and length > 0' latest.json >/dev/null; then
              echo "::error::latest.json field '$f' is missing or empty"
              exit 1
            fi
          done
          if ! jq -e '(.cards // []) | type == "array"' latest.json >/dev/null; then
            echo "::error::latest.json cards is not a list"
            exit 1
          fi
          if [ -n "${MONTH}" ]; then
            if ! printf '%s' "${MONTH}" | grep -Eq '^[0-9]{4}-[0-9]{2}$'; then
              echo "::error::month input must be YYYY-MM"
              exit 1
            fi
            latest_month=$(jq -r '.month' latest.json)
            if [ "${latest_month}" != "${MONTH}" ]; then
              echo "::error::latest.json is for ${latest_month}, not ${MONTH}; gh-pages may not have updated yet"
              exit 1
            fi
          fi
          if [ -z "${SLACK_BOT_TOKEN}" ]; then
            echo "::notice::SLACK_BOT_TOKEN not set; skipping"
            exit 0
          fi
          # Headline and titles are LLM-written; escape Slack mrkdwn control
          # characters so "<!channel>" or "<url|x>" render as text.
          text=$(jq -r '
            def esc: tostring | gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;");
            "*AFH product signal — \(.month_label | esc)*\n\(.headline | esc)\n"
            + ((.cards // []) | map("• \(.title | esc) (\(.kind | esc), \(if .tracked then "tracked" else "NOT tracked" end))") | join("\n"))
            + "\n\(.url | esc)"
          ' latest.json)
          payload=$(jq -n --arg text "$text" --arg channel "${SLACK_CHANNEL}" '{channel: $channel, text: $text}')
          resp=$(curl -sS --fail -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H 'Content-type: application/json; charset=utf-8' \
            --data "$payload")
          echo "$resp" | jq -e '.ok == true' >/dev/null || { echo "::error::Slack post failed: $(echo "$resp" | jq -r '.error // "unknown"')"; exit 1; }

  reminder:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Remind to run the skill
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          if [ -z "${SLACK_BOT_TOKEN}" ]; then
            echo "::notice::SLACK_BOT_TOKEN not set; skipping"
            exit 0
          fi
          prev=$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%Y-%m)
          label=$(date -u -d "$(date -u +%Y-%m-01) -1 day" +"%B %Y")
          text="${label}'s AFH data is ready — run \`/afh-signal month ${prev}\` locally."
          payload=$(jq -n --arg text "$text" --arg channel "${SLACK_CHANNEL}" '{channel: $channel, text: $text}')
          resp=$(curl -sS --fail -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H 'Content-type: application/json; charset=utf-8' \
            --data "$payload")
          echo "$resp" | jq -e '.ok == true' >/dev/null || { echo "::error::Slack post failed: $(echo "$resp" | jq -r '.error // "unknown"')"; exit 1; }
